name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ['android-shell/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor-Projekt erzeugen
        run: |
          npm install --no-audit --no-fund
          if [ -f google-services.json ]; then npm install --no-audit --no-fund @capacitor-firebase/messaging@^8 firebase@^12; fi
          npx cap add android
          node patch-android.mjs
          npx cap sync android
      - name: Signaturschlüssel prüfen
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Secret ANDROID_KEYSTORE_PASS fehlt (siehe docs/EINRICHTUNG.md, Schritt 1)"; exit 1; fi
          cp wattsup.jks android/app/wattsup.jks
      - name: APK bauen
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VCODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../wattsup.apk
      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "WattsUp für Android" --notes "Immer die neueste Version. Am Handy herunterladen und installieren."
          gh release upload apk wattsup.apk --clobber
          gh release edit apk --notes "Neueste Version 1.${{ github.run_number }}, gebaut $(date -u +'%d.%m.%Y %H:%M') UTC. Am Handy herunterladen und installieren."
