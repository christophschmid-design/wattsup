name: Web-Version veröffentlichen
on:
  push:
    branches: [main]
    paths-ignore: ['karoo/**', '.github/workflows/karoo.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        run: python3 tools/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Selbsttest vorbereiten
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2 typescript@5.6.3
          npx playwright install --with-deps chromium
      - name: Selbsttest (bei Fehlern wird nicht veröffentlicht)
        run: node tools/selftest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
